name: Verify containers

# A broken container is invisible: it still appears in a listing, still has a plausible size, and
# only fails when somebody opens it. This runs the same check a visitor can run — pure standard
# library, no Massing, no ifcopenshell, no modelmaker checkout — on every push.

on:
  push:
    branches: [main]
    paths: ['samples/**', 'tools/verify_containers.py', '.github/workflows/verify.yml']
  pull_request:
    paths: ['samples/**', 'tools/verify_containers.py', '.github/workflows/verify.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    name: Containers open and describe themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Validates the archive, the manifest's own entry inventory against what is actually in the
      # archive, the element index against the manifest's element count, and that every
      # data/*.json is an array of row objects.
      - name: Verify every .mass
        run: python tools/verify_containers.py

      # The sector definitions drive every figure in the library — gross area, cost per square foot,
      # rent, the pro forma. Nothing ties them to the geometry automatically, so they drifted once:
      # a 372,000 sf office was declared against a footprint that builds 173,000 sf, and the
      # executive report priced the larger number against the smaller building.
      - name: Check declared areas agree with the geometry
        run: python tools/sectors.py

      # Each sample must be readable without the app. Rather than demand a fixed list of files from
      # every container — which fails a contributed package for lacking a table it never had — the
      # requirement is derived from what the container actually holds: carry a table, and the CSV
      # beside it must exist. `tools/export_container_csv.py` produces them for any container.
      - name: Check every sample carries its data as readable files
        run: |
          python - <<'PY'
          import glob, json, os, sys, zipfile

          # table in the container -> companion file that must sit beside it
          COMPANION = {
              "mod_budget": "budget.csv",
              "mod_schedule_activity": "schedule.csv",
              "mod_sov": "schedule-of-values.csv",
              "mod_permit": "approvals.csv",
              "mod_risk": "risk-register.csv",
              "mod_procurement_package": "procurement.csv",
              "mod_drawing": "sheet-register.csv",
              "mod_space_program": "space-program.csv",
              "scenarios": "proforma.csv",
          }

          fail = 0
          for mass in sorted(glob.glob("samples/*/*.mass")):
              d, key = os.path.dirname(mass), os.path.basename(mass)[:-5]
              with zipfile.ZipFile(mass) as z:
                  tables = json.loads(z.read("manifest.json")).get("tables") or {}

              # The authoring demo predates the commercial data and carries none of it on purpose.
              if not any(t in COMPANION for t in tables):
                  print(f"ok    {key}: no data tables, nothing required")
                  continue

              missing = [f"{key}-{fn}" for t, fn in COMPANION.items()
                         if tables.get(t) and not os.path.exists(os.path.join(d, f"{key}-{fn}"))]
              if not os.path.exists(os.path.join(d, f"{key}-executive-report.md")):
                  missing.append(f"{key}-executive-report.md")
              if not os.path.isdir(os.path.join(d, f"{key}-sheets")):
                  missing.append(f"{key}-sheets/")

              for m in missing:
                  print(f"::error file={mass}::missing {m}")
              fail |= bool(missing)
              print(f"{'FAIL ' if missing else 'ok   '} {key}: "
                    f"{sum(1 for t in tables if t in COMPANION)} table(s), {len(missing)} missing")
          sys.exit(1 if fail else 0)
          PY

      # The site links every container and sheet by relative path. A page pointing at a file that
      # is not there is a 404 nobody notices until a visitor finds it.
      - name: Check the site has no broken local links
        run: |
          python - <<'PY'
          import os, re, sys
          bad = []
          for name in sorted(os.listdir('docs')):
              if not name.endswith('.html'):
                  continue
              src = open(os.path.join('docs', name), encoding='utf-8').read()
              for ref in re.findall(r'(?:href|src)="([^"]+)"', src):
                  if ref.startswith(('http', 'data:', '#', 'mailto')):
                      continue
                  if not os.path.exists(os.path.join('docs', ref)):
                      bad.append(f'{name} -> {ref}')
          for b in bad:
              print(f'::error::broken link {b}')
          print(f'{len(bad)} broken link(s)')
          sys.exit(1 if bad else 0)
          PY
